<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOPPER · Situation Room</title>
    <meta
      name="description"
      content="Every alert is five hops from a customer. Nobody walks them."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three faces, each with exactly one job.

      Archivo (variable, `wdth` axis) appears only at the two extremes of scale:
      the countdown and the hop count at 44-62px, and the 9px silkscreen panel
      labels. Nothing in between. If the `wdth` axis fails to resolve it
      degrades to Archivo 700 with letter-spacing — see .display in styles.css.

      Instrument Sans carries prose and verdicts: a grotesque with squared
      terminals and narrow apertures that reads as gauge lettering rather than
      as another SaaS UI face.

      Spline Sans Mono carries every number, hash, path and timestamp. It is
      humanist rather than mechanical, which keeps dense data legible at 10px
      without looking like a code editor.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Instrument+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
