<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOPPER · Situation Room</title>
    <meta
      name="description"
      content="Every alert is five hops from a customer. Nobody walks them."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three faces, each with exactly one job.

      Archivo (variable, `wdth` axis) appears only at the two extremes of scale:
      the countdown and the hop count at 44-62px, and the 9px silkscreen panel
      labels. Nothing in between. If the `wdth` axis fails to resolve it
      degrades to Archivo 700 with letter-spacing — see .display in styles.css.

      Chivo carries prose and verdicts. It replaced Instrument Sans here
      deliberately: Chivo and Archivo are siblings from the same foundry, drawn
      to be set together, so the 12px verdict and the 58px hop count read as one
      voice at two volumes instead of two faces sharing a screen. Chivo also
      carries a taller x-height and flatter terminals, which is what keeps an
      11.5px agent name legible against a dark ground. Instrument Sans was the
      softer, friendlier face; this instrument does not want to be friendly.

      Spline Sans Mono carries every number, hash, path and timestamp. It is
      humanist rather than mechanical, which keeps dense data legible at 10px
      without looking like a code editor.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,400..700&family=Chivo:wght@300;400;500;600;700&family=Spline+Sans+Mono:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
