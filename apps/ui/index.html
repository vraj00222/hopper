<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOPPER · Situation Room</title>
    <meta

      content="Every alert is five hops from a customer. Nobody walks them."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo is served as a variable font with a `wdth` axis; 125 is the
      Expanded width used for the clock and the hop count. If the axis fails to
      resolve the CSS degrades to Archivo 700 with letter-spacing — see the
      .display rule in styles.css.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
